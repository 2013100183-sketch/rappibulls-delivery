<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento · Rappibull's</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>🐂 Sigue tu pedido</h1><p>Rappibull's Delivery</p></header><section class="card"><p id="error" class="error"></p><div id="order">Cargando seguimiento...</div></section></main><script src="common.js"></script><script>
let loading=false;async function refresh(){if(loading)return;loading=true;try{const {order:o}=await api('client_view',{token:token()});$('error').textContent='';$('order').innerHTML=`<h2>${esc(o.code)} · ${pill(o)}</h2><p><b>Local:</b> ${esc(o.local)}</p><p><b>Motorizado:</b> ${esc(o.riderName||'Por confirmar')}</p><h3>Estado de tu pedido</h3>${STAGES.map((s,i)=>`<div class="status-line ${i===o.stage?'current':i<o.stage?'done':''}">${i<=o.stage?'✓':'○'} ${esc(s)}</div>`).join('')}${eta(o)}${total(o)}<p class="muted">Última actualización: ${new Date(o.updated).toLocaleString('es-PE')}</p>`}catch(e){$('error').textContent=e.message}finally{loading=false}}
refresh();setInterval(refresh,3000);
</script></body></html>
