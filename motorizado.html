<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motorizado · Rappibull's</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>🏍️ Mis pedidos</h1><p id="name">Rappibull's Delivery</p></header><section class="card"><p id="error" class="error"></p><div id="orders">Cargando...</div></section></main><script src="common.js"></script><script>
let pending=false;async function refresh(){if(pending)return;pending=true;try{const d=await api('rider_view',{token:token()});$('name').textContent='Motorizado: '+d.rider.name;$('error').textContent='';$('orders').innerHTML=d.orders.map(o=>`<div class="item"><div class="row"><h3>${esc(o.code)} · ${esc(o.local)}</h3>${pill(o)}</div><p><b>Productos:</b> ${esc(o.products)}</p><p><b>Dirección:</b> ${esc(o.address)}</p><p><b>Referencia:</b> ${esc(o.reference)}</p><p><b>Indicaciones:</b> ${esc(o.instructions)}</p><p><b>Teléfono:</b> ${esc(o.phone)}</p>${o.map?`<p><a target="_blank" rel="noopener noreferrer" href="${esc(/^https:\/\//i.test(o.map)?o.map:'#')}">Abrir mapa</a></p>`:''}${total(o)}${eta(o)}${!o.cancelled&&!o.rejected&&o.stage<5?`<button data-next="${o.id}" data-stage="${o.stage+1}">${o.stage===0?'Aceptar pedido':'Marcar: '+STAGES[o.stage+1]}</button>${o.stage===0?`<button class="danger" data-reject="${o.id}">Rechazar pedido</button>`:''}`:''}</div>`).join('')||'<p>Sin pedidos asignados.</p>'}catch(e){$('error').textContent=e.message}finally{pending=false}}
$('orders').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.next||b.dataset.reject;if(!id)return;try{await api('rider_update',{token:token(),id,choice:b.dataset.reject?'reject':'advance',stage:Number(b.dataset.stage)});await refresh()}catch(e){alert(e.message)}};refresh();setInterval(refresh,3000);
</script></body></html>
